cknet von selbst fertig.", "Räumen Sie zuerst den unteren und dann den oberen Korb aus, sonst tropft Wasser von den Tassen auf das saubere Geschirr.", "Lassen Sie die Tür einen Spalt offen, damit die Maschine trocknet."], "hf": "So reinigen Sie den Filter", "hf_note": "(wenn das Geschirr nicht sauber wird oder unten Wasser steht)", "fsteps": ["Schalten Sie die Maschine aus und nehmen Sie den unteren Korb heraus.", "In der Mitte des Bodens sitzt ein runder Filter. Drehen Sie ihn gegen den Uhrzeigersinn und ziehen Sie ihn zusammen mit dem flachen Sieb darunter nach oben heraus.", "Spülen Sie alles unter fließendem Wasser ab und werfen Sie Speisereste in den Müll, nicht ins Spülbecken.", "Setzen Sie ihn wieder ein und drehen Sie ihn im Uhrzeigersinn bis zum Anschlag. Betreiben Sie die Maschine nie ohne Filter oder mit locker sitzendem Filter."], "h5": "Wenn etwas nicht stimmt", "err_head": ["Was Sie sehen", "Was zu tun ist"], "err": [["Die Tasten reagieren nicht", "Die Tastensperre ist aktiv. Suchen Sie die Taste mit dem Schlüsselsymbol oder der Aufschrift „3 seg“ und halten Sie sie 3 bis 4 Sekunden gedrückt, bis das Symbol erlischt."], ["Im Display erscheint ein Code mit dem Buchstaben E (zum Beispiel E:15)", "Fotografieren Sie den Code. Schalten Sie die Maschine mit der Ein-/Aus-Taste aus und schreiben Sie uns."], ["Schaum oder Wasser auf dem Boden", "Schalten Sie die Maschine aus, drehen Sie den Hahn zu und schreiben Sie uns sofort."], ["Nach dem Spülen steht unten Wasser", "Der Filter ist verstopft. Reinigen Sie ihn wie oben beschrieben."]]}}};
  const LANGS = Object.keys(I18N);

  function pickLang() {
    try { const s = localStorage.getItem('lang'); if (s && I18N[s]) return s; } catch (e) {}
    const nav = (navigator.language || 'en').slice(0, 2).toLowerCase();
    const map = { nb: 'no', nn: 'no' };
    const l = map[nav] || nav;
    return I18N[l] ? l : 'en';
  }

  function apply(lang) {
    const dict = I18N[lang];
    document.documentElement.lang = lang;
    document.querySelectorAll('[data-i18n]').forEach(el => {
      const v = dict[el.dataset.i18n];
      if (v === undefined) return;
      if (v.indexOf('<b>') !== -1) el.innerHTML = v; else el.textContent = v;
    });
    document.querySelectorAll('.flag').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.lang === lang)));
    try { localStorage.setItem('lang', lang); } catch (e) {}
    window.__lang = lang;
    renderWash(lang);
    renderDish(lang);
  }

  function esc(t) { return String(t).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
  function rows(head, items, brk) {
    const c2 = x => brk ? esc(x).replace(/([\/+])/g, '$1<wbr>') : esc(x);
    return '<div class="wrow head"><span>' + esc(head[0]) + '</span><span>' + esc(head[1]) + '</span></div>' +
      items.map(r => '<div class="wrow"><span>' + esc(r[0]) + '</span><span>' + c2(r[1]) + '</span></div>').join('');
  }
  function renderWash(lang) {
    const w = WASH.text[lang], el = document.getElementById('washBody');
    if (!w || !el) return;
    const li = a => a.map(x => '<li>' + esc(x) + '</li>').join('');
    el.innerHTML =
      '<h3>' + esc(w.h1) + '</h3><ul>' + li(w.l1) + '</ul>' +
      '<h3>' + esc(w.h2) + '</h3><p class="lead">' + esc(w.tray_intro) + '</p>' +
      '<div class="wtable tray">' + w.tray.map(r => '<div class="wrow"><span>' + esc(r[0]) + '</span><span>' + esc(r[1]) + '</span></div>').join('') + '</div>' +
      '<p>' + esc(w.tray_after) + '</p>' +
      '<p class="warn"><b>' + esc(w.warn_label) + '</b> ' + esc(w.warn) + '</p>' +
      '<h3>' + esc(w.h3) + '</h3><ol>' + li(w.steps) + '</ol>' +
      '<p>' + esc(w.prog_intro) + '</p>' +
      '<div class="wtable prog">' + rows(w.prog_head, w.prog.map((t, i) => [t, WASH.codes[i]]), true) + '</div>' +
      '<p>' + esc(w.prog_note) + '</p>' +
      '<h3>' + esc(w.h4) + '</h3><ul>' + li(w.l4) + '</ul>' +
      '<h3>' + esc(w.h5) + '</h3><p class="never"><b>' + esc(w.never_label) + '</b> ' + esc(w.never) + '</p>' +
      '<div class="wtable err">' + rows(w.err_head, w.err) + '</div>';
  }

  function renderDish(lang) {
    const w = DISH.text[lang], el = document.getElementById('dishBody');
    if (!w || !el) return;
    const li = a => a.map(x => '<li>' + esc(x) + '</li>').join('');
    el.innerHTML =
      '<h3>' + esc(w.h1) + '</h3><ul>' + li(w.l1) + '</ul>' +
      '<h3>' + esc(w.h2) + '</h3><p class="lead">' + esc(w.intro2) + '</p>' +
      '<p class="warn"><b>' + esc(w.rule_label) + '</b> ' + esc(w.rule) + '</p>' +
      '<ul class="after-warn">' + li(w.l2) + '</ul>' +
      '<h3>' + esc(w.h3) + '</h3><ol>' + li(w.steps) + '</ol>' +
      '<p>' + esc(w.prog_intro) + '</p>' +
      '<div class="wtable prog">' + rows(w.prog_head, w.prog.map((t, i) => [t, DISH.codes[i]]), true) + '</div>' +
      '<p>' + esc(w.prog_note) + '</p>' +
      '<h3>' + esc(w.h4) + '</h3><ul>' + li(w.l4) + '</ul>' +
      '<p class="subh"><b>' + esc(w.hf) + '</b> ' + esc(w.hf_note) + '</p><ol>' + li(w.fsteps) + '</ol>' +
      '<h3>' + esc(w.h5) + '</h3>' +
      '<div class="wtable err">' + rows(w.err_head, w.err) + '</div>';
  }

  function openFromHash() {
    const id = location.hash.slice(1);
    if (id === 'washer' || id === 'dishwasher') {
      const d = document.getElementById(id);
      if (d) { d.open = true; d.scrollIntoView(); }
    }
  }
  window.addEventListener('hashchange', openFromHash)

  document.querySelectorAll('.flag').forEach(b => b.addEventListener('click', () => apply(b.dataset.lang)));

  function selectText(el) {
    const r = document.createRange(); r.selectNodeContents(el);
    const s = window.getSelection(); s.removeAllRanges(); s.addRange(r);
  }

  document.querySelectorAll('.copy').forEach(btn => btn.addEventListener('click', () => {
    const el = document.getElementById(btn.dataset.copy);
    const text = el.textContent.trim();
    const done = () => {
      btn.textContent = I18N[window.__lang].copied; btn.classList.add('done');
      setTimeout(() => { btn.textContent = I18N[window.__lang].copy; btn.classList.remove('done'); }, 1600);
    };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(done, () => selectText(el));
    } else { selectText(el); }
  }));

  apply(pickLang());
  openFromHash();
</script>
