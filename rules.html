<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Welcome guide · Cala de Finestrat</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600&family=Fraunces:ital,opsz,wght@0,9..144,300;1,9..144,300;1,9..144,400&display=swap" rel="stylesheet" />
<style>
  /* Phone-first guest guide: one narrow column, sticky language bar, jump tiles, then one block per topic. */
  :root {
    --sea: #1a7fa0;
    --sea-mid: #2a9dc2;
    --sea-light: #e8f4f8;
    --sea-pale: #f2f9fc;
    --white: #ffffff;
    --sand: #e8e2d8;
    --ink: #16202a;
    --ink-mid: #3d4f5c;
    --ink-soft: #62768a;
    --warm: #c87941;
    --ok: #2e8b57;
    --display: 'Fraunces', Georgia, serif;
    --body: 'Outfit', system-ui, sans-serif;
    color-scheme: light;
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html { font-size: 16px; scroll-behavior: smooth; -webkit-text-size-adjust: 100%; }
  body { font-family: var(--body); background: var(--white); color: var(--ink); overflow-x: hidden; }
  @media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }

  .langbar {
    position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20;
    background: rgba(255,255,255,0.96);
    border-bottom: 1px solid var(--sea-light);
    padding: 10px 16px;
  }
  .langs { max-width: 480px; margin: 0 auto; display: flex; justify-content: space-between; gap: 4px; }
  .flag {
    flex: 1 1 0; min-width: 0; max-width: 44px; height: 36px;
    display: flex; align-items: center; justify-content: center;
    background: none; border: 0; border-radius: 8px; cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  .flag svg { width: 30px; height: 21px; border-radius: 3px; box-shadow: 0 0 0 1px rgba(22,32,42,0.14); display: block; }
  .flag[aria-pressed="true"] { background: var(--sea-light); box-shadow: inset 0 0 0 2px var(--sea); }
  .flag:focus-visible { outline: 2px solid var(--sea); outline-offset: 2px; }

  main { max-width: 480px; margin: 0 auto; padding: 0 20px 56px; }

  .back {
    display: inline-block; margin: 18px 0 0; font-size: 0.8rem; font-weight: 500;
    color: var(--sea); text-decoration: none; padding: 6px 0;
  }
  h1 {
    font-family: var(--display); font-style: italic; font-weight: 300;
    font-size: 2.6rem; line-height: 1.1; margin-top: 10px; text-wrap: balance;
  }
  .intro { margin-top: 14px; font-size: 1rem; font-weight: 300; line-height: 1.55; color: var(--ink-mid); }

  .tiles { margin-top: 26px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
  .tile {
    display: flex; flex-direction: column; align-items: center; gap: 7px;
    padding: 12px 2px 10px; border-radius: 12px; background: var(--sea-pale);
    color: var(--ink-mid); text-decoration: none; font-size: 0.7rem; font-weight: 500;
    text-align: center; line-height: 1.15; overflow-wrap: anywhere;
  }
  .tile svg { width: 24px; height: 24px; stroke: var(--sea); fill: none; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
  .tile:active { background: var(--sea-light); }

  .blk { padding-top: 34px; scroll-margin-top: calc(env(safe-area-inset-top, 0px) + 64px); }
  .blk + .blk { margin-top: 34px; border-top: 1px solid var(--sand); }
  .blk-head { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; }
  .ico {
    flex: none; width: 38px; height: 38px; border-radius: 50%; background: var(--sea-light);
    display: flex; align-items: center; justify-content: center;
  }
  .ico svg { width: 20px; height: 20px; stroke: var(--sea); fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  h2 { font-size: 1.15rem; font-weight: 600; letter-spacing: 0.01em; }
  p { font-size: 0.97rem; font-weight: 300; line-height: 1.6; color: var(--ink-mid); }
  p + p { margin-top: 12px; }
  p b { font-weight: 600; color: var(--ink); }

  .fact {
    margin: 16px 0; padding: 14px 16px; border-radius: 12px; background: var(--sea-pale);
    display: flex; align-items: baseline; justify-content: space-between; gap: 12px;
  }
  .fact-label { font-size: 0.68rem; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; color: var(--ink-soft); }
  .fact-val { font-family: var(--body); font-weight: 300; font-size: 2.3rem; line-height: 1; color: var(--ink); text-align: right; }
  .fact-val.sm { font-size: 1.35rem; }

  figure.map { margin-top: 16px; }
  figure.map img { display: block; width: 100%; height: auto; border-radius: 12px; }
  figcaption { margin-top: 8px; font-size: 0.75rem; color: var(--ink-soft); }

  .cred { margin-top: 4px; display: flex; flex-direction: column; gap: 10px; }
  .cred-row {
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
    padding: 12px 12px 12px 16px; border-radius: 12px; background: var(--sea-pale);
  }
  .cred-text { min-width: 0; display: flex; flex-direction: column; gap: 3px; }
  .cred-label { font-size: 0.66rem; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; color: var(--ink-soft); }
  .cred-val { font-size: 1.05rem; font-weight: 500; color: var(--ink); overflow-wrap: anywhere; user-select: all; -webkit-user-select: all; }
  .copy {
    flex: none; min-width: 84px; padding: 10px 14px; border: 1.5px solid var(--sea); border-radius: 10px;
    background: var(--white); color: var(--sea); font: 500 0.8rem var(--body); cursor: pointer;
  }
  .copy.done { background: var(--sea); color: var(--white); }
  .copy:focus-visible { outline: 2px solid var(--sea); outline-offset: 2px; }
  .qr-wrap { margin-top: 18px; display: flex; flex-direction: column; align-items: center; gap: 10px; }
  .qr { width: 168px; height: 168px; border-radius: 10px; box-shadow: 0 0 0 1px var(--sand); }
  .qr-wrap p { font-size: 0.85rem; text-align: center; }

  .app-list { margin-top: 16px; display: flex; flex-direction: column; gap: 10px; }
  .app-row {
    display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: 12px;
    background: var(--sea-pale); color: var(--ink); text-decoration: none; font-size: 1rem; font-weight: 500;
  }
  .app-row svg { flex: none; width: 24px; height: 24px; stroke: var(--sea); fill: none; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
  .app-row .app-name { flex: 1; min-width: 0; }
  .app-row .soon { flex: none; font-size: 0.7rem; font-weight: 500; letter-spacing: 0.04em; color: var(--ink-soft); }
  a.app-row:active { background: var(--sea-light); }

  .app-det { border-radius: 12px; background: var(--sea-pale); scroll-margin-top: calc(env(safe-area-inset-top, 0px) + 64px); }
  .app-det summary { list-style: none; cursor: pointer; -webkit-tap-highlight-color: transparent; }
  .app-det summary::-webkit-details-marker { display: none; }
  .app-det summary:focus-visible { outline: 2px solid var(--sea); outline-offset: 2px; border-radius: 12px; }
  .app-det .chev { margin-left: auto; transition: transform 0.15s; }
  .app-det[open] .chev { transform: rotate(180deg); }
  .app-det[open] summary { border-bottom-left-radius: 0; border-bottom-right-radius: 0; }
  @media (prefers-reduced-motion: reduce) { .app-det .chev { transition: none; } }

  .wash { padding: 4px 14px 20px; font-size: 0.95rem; }
  .wash h3 { margin-top: 24px; margin-bottom: 10px; font-size: 1rem; font-weight: 600; color: var(--ink); }
  .wash h3:first-child { margin-top: 12px; }
  .wash ul, .wash ol { display: flex; flex-direction: column; gap: 9px; }
  .wash ul { list-style: none; }
  .wash li { font-size: 0.93rem; font-weight: 300; line-height: 1.5; color: var(--ink-mid); padding-left: 16px; position: relative; }
  .wash li::before { content: ''; position: absolute; left: 0; top: 0.62em; width: 5px; height: 5px; border-radius: 50%; background: var(--sea-mid); }
  .wash ol { padding-left: 0; counter-reset: st; list-style: none; }
  .wash ol li { padding-left: 28px; counter-increment: st; }
  .wash ol li::before { content: counter(st); width: 20px; height: 20px; top: 0.1em; border-radius: 50%; background: var(--sea); color: var(--white); font-size: 0.72rem; font-weight: 600; display: flex; align-items: center; justify-content: center; }
  .wash p { font-size: 0.93rem; margin-top: 12px; }
  .wash .lead { margin-top: 0; margin-bottom: 10px; }
  .wtable { margin: 4px 0 0; background: var(--white); border-radius: 10px; overflow: hidden; }
  .wrow { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 12px; padding: 10px 12px; border-top: 1px solid var(--sea-light); font-size: 0.88rem; line-height: 1.4; color: var(--ink-mid); }
  .wrow:first-child { border-top: 0; }
  .wrow.head { font-size: 0.64rem; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: var(--ink-soft); background: var(--sea-light); }
  .wrow > :first-child { overflow-wrap: break-word; hyphens: auto; }
  .wrow > :last-child { overflow-wrap: anywhere; }
  .wtable.prog .wrow { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
  .wtable.prog .wrow > :last-child { font-weight: 600; color: var(--ink); font-size: 0.82rem; overflow-wrap: normal; }
  .wtable.prog .wrow.head > :last-child { font-size: 0.64rem; color: var(--ink-soft); }
  .wtable.err .wrow > :first-child { font-weight: 600; color: var(--ink); }
  .wtable.err .wrow.head > :first-child { font-weight: 600; color: var(--ink-soft); }
  .wtable.tray .wrow { grid-template-columns: minmax(0, 0.8fr) minmax(0, 1.2fr); }
  .wtable.tray .wrow > :first-child { font-weight: 600; color: var(--ink); }
  .warn { margin-top: 14px; padding: 12px 14px; border-radius: 10px; background: #fdf1e6; font-size: 0.9rem; line-height: 1.5; color: var(--ink); }
  .warn b { color: #8a4a1c; font-weight: 600; }
  .after-warn { margin-top: 14px; }
  .subh { margin-top: 18px; margin-bottom: 10px; color: var(--ink-mid); }
  .subh b { color: var(--ink); font-weight: 600; }
  .never { margin-top: 0; margin-bottom: 12px; }
  .never b { color: var(--ink); font-weight: 600; }

  .wa {
    margin-top: 18px; display: flex; align-items: center; justify-content: center; gap: 10px;
    padding: 15px 18px; border-radius: 14px; background: var(--sea); color: var(--white);
    text-decoration: none; font-size: 1rem; font-weight: 600;
  }
  .wa svg { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  .wa:active { background: var(--ink); }

  .bye { margin-top: 38px; padding: 20px; border-radius: 14px; background: var(--sea-pale); }
  .bye p:last-child { font-family: var(--display); font-style: italic; font-weight: 300; font-size: 1.25rem; line-height: 1.35; color: var(--ink); }
</style>
</head>

jours, 10:00–21:00", "pool_1": "La piscine chauffée se trouve au rez-de-chaussée.", "pool_2": "Partez du hall principal. Prenez la porte vitrée du fond (carte d'accès blanche), tournez à gauche et marchez environ 80 mètres.", "wifi_h": "Wi-Fi", "network": "Réseau", "password": "Mot de passe", "copy": "Copier", "copied": "Copié", "wifi_scan": "Ou scannez le code QR avec l'appareil photo de votre téléphone.", "tv_h": "TV", "tv_1": "Connectez-vous à Netflix, Prime Video et aux autres services de streaming avec vos propres comptes, et n'oubliez pas de vous déconnecter avant le départ.", "babies_h": "Séjour avec bébé", "babies_1": "Nous savons que voyager avec de jeunes enfants n'est pas simple. Vous pouvez louer un lit bébé et/ou une chaise haute pour 3 euros par nuit et par article. Demandez simplement à l'hôte, qui les montera depuis le débarras.", "rules_h": "Règles", "rules_1": "<b>Interdiction stricte de fumer.</b> Ne fumez ni tabac ni aucune autre substance (cigarettes électroniques comprises) dans l'appartement ou sur le balcon. En cas d'infraction, 100 euros de frais de ménage supplémentaires seront facturés.", "rules_2": "Nos voisins sont des habitants sympathiques qui se lèvent tôt. Merci d'éviter les fêtes et les célébrations bruyantes dans la propriété.", "rules_3": "Merci de ne pas déplacer les meubles de l'appartement.", "co_h": "Départ", "co_1": "L'heure de départ est fixée à 12:00.", "co_2": "Pour rendre service à l'hôte, déposez vos déchets dans les conteneurs de la rue.", "co_3": "Laissez les clés comme convenu avec l'hôte.", "contact_h": "Contact", "contact_1": "Pour toute question ou problème, appelez l'hôte au numéro fourni. Si vous n'arrivez pas à le joindre, écrivez aux propriétaires sur WhatsApp. Nous sommes disponibles du lundi au dimanche, de 10:00 à 19:00.", "wa": "Écrire sur WhatsApp", "thanks_1": "N'hésitez pas à partager votre avis positif sur la plateforme où vous avez réservé, ou directement avec nous. Si vous souhaitez revenir, écrivez-nous pour une réservation directe.", "thanks_2": "Nous vous souhaitons un excellent séjour et espérons vous revoir !", "n_appliances": "Appareils", "appliances_h": "Appareils", "appliances_1": "Modes d'emploi de la cuisinière, du lave-linge, du micro-ondes et des autres appareils.", "ap_stove": "Cuisinière", "ap_washer": "Lave-linge", "ap_microwave": "Micro-ondes", "ap_soon": "Bientôt disponible", "ap_dishwasher": "Lave-vaisselle"}, "ru": {"back": "Апартаменты", "title": "Добро пожаловать!", "intro": "Мы рады, что вы выбрали наши апартаменты. Чтобы вам было максимально комфортно, собрали полезную информацию.", "n_parking": "Парковка", "n_pool": "Бассейн", "n_wifi": "Wi-Fi", "n_tv": "ТВ", "n_babies": "С детьми", "n_rules": "Правила", "n_checkout": "Выезд", "n_contact": "Связь", "parking_h": "Парковка", "parking_1": "Гости могут пользоваться подземным гаражом, в который ведёт лифт.", "parking_2": "Правый лифт едет в гараж, и для него нужен маленький металлический ключ на вашей связке. Этот же ключ нужен, чтобы подняться обратно из гаража.", "spot": "Ваше место", "parking_3": "Если вы за рулём, пользуйтесь картой.", "map_cap": "Схема проезда", "pool_h": "Бассейн", "pool_hours": "Ежедневно, 10:00–21:00", "pool_1": "Бассейн с подогревом находится на первом этаже.", "pool_2": "Начните от главного холла. Выйдите через стеклянную заднюю дверь (нужна белая карта доступа), поверните налево и пройдите около 80 метров.", "wifi_h": "Wi-Fi", "network": "Сеть", "password": "Пароль", "copy": "Копировать", "copied": "Скопировано", "wifi_scan": "Или отсканируйте QR-код камерой телефона.", "tv_h": "Телевизор", "tv_1": "Входите в Netflix, Prime Video и другие стриминговые сервисы под своими аккаунтами и не забудьте выйти из них перед выездом.", "babies_h": "Если вы с малышом", "babies_1": "Мы знаем, как непросто путешествовать с маленькими детьми. Можно взять в аренду детскую кроватку и/или стульчик для кормления: 3 евро за ночь за каждый предмет. Просто попросите хозяина, и их принесут из кладовой.", "rules_h": "Правила", "rules_1": "<b>Курение строго запрещено.</b> Нельзя курить табак и любые вещества (включая электронные сигареты) в квартире и на балконе. За нарушение взимается дополнительная плата за уборку 100 евро.", "rules_2": "Наши соседи доброжелательные местные жители, которые рано встают. Пожалуйста, не устраивайте вечеринок и шумных праздников.", "rules_3": "Пожалуйста, не переставляйте мебель в квартире.", "co_h": "Выезд", "co_1": "Время выезда: 12:00.", "co_2": "Просим вынести мусор в уличные контейнеры, это поможет хозяину.", "co_3": "Оставьте ключи, как договорились с хозяином.", "contact_h": "Связь с хозяевами", "contact_1": "Если возникнут вопросы или проблемы, позвоните хозяину по выданному номеру. Если не дозвонились, напишите владельцам в WhatsApp. Мы на связи с понедельника по воскресенье, с 10:00 до 19:00.", "wa": "Написать в WhatsApp", "thanks_1": "Будем благодарны за положительный отзыв на платформе, где вы бронировали, или лично нам. Если захотите приехать снова, напишите нам, чтобы забронировать напрямую.", "thanks_2": "Желаем вам прекрасного отдыха и надеемся увидеть вас снова!", "n_appliances": "Техника", "appliances_h": "Техника", "appliances_1": "Инструкции к плите, стиральной машине, микроволновке и другой технике.", "ap_stove": "Плита", "ap_washer": "Стиральная машина", "ap_microwave": "Микроволновка", "ap_soon": "Скоро", "ap_dishwasher": "Посудомоечная машина"}, "no": {"back": "Leiligheten", "title": "Velkommen!", "intro": "Vi er glade for at du har valgt leiligheten vår. For at oppholdet skal bli så behagelig som mulig, har vi samlet litt nyttig informasjon.", "n_parking": "Parkering", "n_pool": "Basseng", "n_wifi": "Wi-Fi", "n_tv": "TV", "n_babies": "Baby", "n_rules": "Regler", "n_checkout": "Utsjekk", "n_contact": "Kontakt", "parking_h": "Parkering", "parking_1": "Gjester kan bruke garasjen under bakken, som nås med heisen.", "parking_2": "Heisen til høyre går ned til garasjen og krever den lille metallnøkkelen hold og håper å se deg igjen!", "n_appliances": "Apparater", "appliances_h": "Apparater", "appliances_1": "Bruksanvisninger for komfyr, vaskemaskin, mikrobølgeovn og andre apparater.", "ap_stove": "Komfyr", "ap_washer": "Vaskemaskin", "ap_microwave": "Mikrobølgeovn", "ap_soon": "Kommer snart", "ap_dishwasher": "Oppvaskmaskin"}, "sv": {"back": "Lägenheten", "title": "Välkommen!", "intro": "Vi är glada att du har valt vår lägenhet. För att din vistelse ska bli så bekväm som möjligt har vi samlat lite användbar information.", "n_parking": "Parkering", "n_pool": "Pool", "n_wifi": "Wi-Fi", "n_tv": "TV", "n_babies": "Bebis", "n_rules": "Regler", "n_checkout": "Utcheckning", "n_contact": "Kontakt", "parking_h": "Parkering", "parking_1": "Gäster kan använda garaget under jord, som nås med hissen.", "parking_2": "Hissen till höger går ner till garaget och kräver den lilla metallnyckeln på din nyckelring. Samma nyckel behövs för att ta sig upp från garaget igen.", "spot": "Din plats", "parking_3": "Använd kartan när du kör.", "map_cap": "Vägkarta", "pool_h": "Pool", "pool_hours": "Varje dag, 10:00–21:00", "pool_1": "Den uppvärmda poolen ligger på bottenplanet.", "pool_2": "Utgå från huvudhallen. Använd glasdörren längst bak (vitt passerkort), sväng vänster och gå ungefär 80 meter.", "wifi_h": "Wi-Fi", "network": "Nätverk", "password": "Lösenord", "copy": "Kopiera", "copied": "Kopierat", "wifi_scan": "Eller skanna QR-koden med telefonens kamera.", "tv_h": "TV", "tv_1": "Logga in på Netflix, Prime Video och andra streamingtjänster med dina egna konton och glöm inte att logga ut före utcheckningen.", "babies_h": "Vistelse med bebis", "babies_1": "Vi vet att det kan vara krävande att resa med små barn. Du kan hyra resesäng och/eller barnstol för 3 euro per natt och sak. Fråga värden så kommer de upp med dem från förrådet.", "rules_h": "Regler", "rules_1": "<b>Strikt rökförbud.</b> Rök inte tobak eller andra ämnen (inklusive e-cigaretter) i lägenheten eller på balkongen. Vid överträdelse tillkommer en städavgift på 100 euro.", "rules_2": "Våra grannar är vänliga lokalbor som går upp tidigt. Undvik fester och högljudda firanden på fastigheten.", "rules_3": "Flytta inte om möblerna i lägenheten.", "co_h": "Utcheckning", "co_1": "Utcheckning är klockan 12:00.", "co_2": "Som en tjänst till värden ber vi dig lägga soporna i containrarna på gatan.", "co_3": "Lämna nycklarna enligt överenskommelse med värden.", "contact_h": "Kontakt", "contact_1": "Har du frågor eller problem, ring värden på det nummer du fått. Går det inte att nå dem, skriv till ägarna på WhatsApp. Vi finns tillgängliga måndag till söndag, 10:00–19:00.", "wa": "Skriv på WhatsApp", "thanks_1": "Dela gärna ett positivt omdöme på plattformen där du bokade, eller direkt med oss. Vill du komma tillbaka, skriv till oss om en direktbokning.", "thanks_2": "Vi önskar dig en härlig vistelse och hoppas få se dig igen!", "n_appliances": "Apparater", "appliances_h": "Apparater", "appliances_1": "Instruktioner för spis, tvättmaskin, mikrovågsugn och andra apparater.", "ap_stove": "Spis", "ap_washer": "Tvättmaskin", "ap_microwave": "Mikrovågsugn", "ap_soon": "Kommer snart", "ap_dishwasher": "Diskmaskin"}, "fi": {"back": "Asunto", "title": "Tervetuloa!", "intro": "Olemme iloisia, että valitsit asuntomme. Jotta oleskelusi olisi mahdollisimman mukava, olemme koonneet tähän hyödyllisiä tietoja.", "n_parking": "Pysäköinti", "n_pool": "Allas", "n_wifi": "Wi-Fi", "n_tv": "TV", "n_babies": "Vauva", "n_rules": "Säännöt", "n_checkout": "Lähtö", "n_contact": "Yhteys", "parking_h": "Pysäköinti", "parking_1": "Vieraat voivat käyttää maanalaista autohallia, johon pääsee hissillä.", "parking_2": "Oikeanpuoleinen hissi menee autohalliin, ja sen käyttöön tarvitaan avainnipussasi oleva pieni metalliavain. Samaa avainta tarvitaan, kun tulet autohallista takaisin ylös.", "spot": "Paikkasi", "parking_3": "Käytä ajaessasi karttaa.", "map_cap": "Ajokartta", "pool_h": "Uima-allas", "pool_hours": "Päivittäin 10:00–21:00", "pool_1": "Lämmitetty uima-allas sijaitsee pohjakerroksessa.", "pool_2": "Lähde päähallista. Käytä takana olevaa lasiovea (valkoinen kulkukortti), käänny vasemmalle ja kävele noin 80 metriä.", "wifi_h": "Wi-Fi", "network": "Verkko", "password": "Salasana", "copy": "Kopioi", "copied": "Kopioitu", "wifi_scan": "Tai skannaa QR-koodi puhelimen kameralla.", "tv_h": "TV", "tv_1": "Kirjaudu Netflixiin, Prime Videoon ja muihin suoratoistopalveluihin omilla tileilläsi ja muista kirjautua ulos ennen lähtöä.", "babies_h": "Vauvan kanssa", "babies_1": "Tiedämme, että pienten lasten kanssa matkustaminen voi olla haastavaa. Voit vuokrata matkasängyn ja/tai syöttötuolin 3 eurolla yöltä per tuote. Kysy asiaa isännältä, niin hän tuo ne varastosta.", "rules_h": "Säännöt", "rules_1": "<b>Tupakointi on ehdottomasti kielletty.</b> Älä polta tupakkaa tai muita aineita (sähkötupakka mukaan lukien) asunnossa tai parvekkeella. Rikkomuksesta peritään 100 euron lisäsiivousmaksu.", "rules_2": "Naapurimme ovat ystävällisiä paikallisia, jotka heräävät aikaisin. Vältä juhlia ja äänekkäitä juhlintoja kiinteistöllä.", "rules_3": "Älä siirtele asunnon huonekaluja.", "co_h": "Lähtö", "co_1": "Lähtöaika on klo 12:00.", "co_2": "Isännän avuksi: vie roskat katujen roskasäiliöihin.", "co_3": "Jätä avaimet isännän kanssa sovitulla tavalla.", "contact_h": "Yhteystiedot", "contact_1": "Jos sinulla on kysyttävää tai ongelmia, soita isännälle annettuun numeroon. Jos et tavoita häntä, kirjoita omistajille WhatsAppissa. Olemme tavoitettavissa maanantaista sunnuntaihin klo 10:00–19:00.", "wa": "Kirjoita WhatsAppissa", "thanks_1": "Jaa mielellään myönteinen palaute alustalla, jolta teit varauksen, tai suoraan meille. Jos haluat tulla uudelleen, laita viestiä suoravarauksesta.", "thanks_2": "Toivotamme sinulle ihanaa oleskelua ja toivomme näkevämme sinut taas!", "n_appliances": "Laitteet", "appliances_h": "Laitteet", "appliances_1": "Käyttöohjeet liedelle, pesukoneelle, mikroaaltouunille ja muille laitteille.", "ap_stove": "Liesi", "ap_washer": "Pesukone", "ap_microwave": "Mikroaaltouuni", "ap_soon": "Tulossa pian", "ap_dishwasher": "Astianpesukone"}, "de": {"back": "Apartment", "title": "Willkommen!", "intro": "Wir freuen uns, dass Sie sich für unser Apartment entschieden haben. Damit Ihr Aufenthalt so angenehm wie möglich wird, haben wir einige nützliche Informationen für Sie zusammengestellt.", "n_parking": "Parken", "n_pool": "Pool", "n_wifi": "WLAN", "n_tv": "TV", "n_babies": "Baby", "n_rules": "Regeln", "n_checkout": "Abreise", "n_contact": "Kontakt", "parking_h": "Parken", "parking_1": "Gäste können die Tiefgarage nutzen, die mit dem Aufzug erreichbar ist.", "parking_2": "Der rechte Aufzug fährt in die Garage und funktioniert nur mit dem kleinen Metallschlüssel an Ihrem Schlüsselbund. Denselben Schlüssel brauchen Sie auch, um aus der Garage wieder nach oben zu fahren.", "spot": "Ihr Stellplatz", "parking_3": "Bitte nutzen Sie beim Fahren die Karte.", "map_cap": "Anfahrtskarte", "pool_h": "Pool", "pool_hours": "Täglich, 10:00–21:00", "pool_1": "Der beheizte Pool befindet sich im Erdgeschoss.", "pool_2": "Gehen Sie von der Haupthalle aus durch die gläserne Hintertür (weiße Zugangskarte), dann links und etwa 80 Meter geradeaus.", "wifi_h": "WLAN", "network": "Netzwerk", "password": "Passwort", "copy": "Kopieren", "copied": "Kopiert", "wifi_scan": "Oder scannen Sie den QR-Code mit der Handykamera.", "tv_h": "TV", "tv_1": "Bitte melden Sie sich mit Ihren eigenen Konten bei Netflix, Prime Video und anderen Streaming-Diensten an und denken Sie daran, sich vor der Abreise abzumelden.", "babies_h": "Aufenthalt mit Baby", "babies_1": "Wir wissen, wie anstrengend Reisen mit Kleinkindern sein kann. Sie können ein Kinderbett und/oder einen Hochstuhl für 3 Euro pro Nacht und Stück mieten. Fragen Sie einfach den Gastgeber, er bringt es Ihnen aus dem Abstellraum nach oben.", "rules_h": "Regeln", "rules_1": "<b>Striktes Rauchverbot.</b> Bitte rauchen Sie weder Tabak noch andere Substanzen (einschließlich E-Zigaretten) in der Wohnung oder auf dem Balkon. Bei einem Verstoß wird eine zusätzliche Reinigungsgebühr von 100 Euro berechnet.", "rules_2": "Unsere Nachbarn sind freundliche Einheimische, die früh aufstehen. Bitte verzichten Sie auf Partys und laute Feiern auf dem Grundstück.", "rules_3": "Bitte stellen Sie die Möbel in der Wohnung nicht um.", "co_h": "Abreise", "co_1": "Die Check-out-Zeit ist 12:00 Uhr.", "co_2": "Als Gefallen für den Gastgeber bitten wir Sie, den Müll in die Container auf der Straße zu bringen.", "co_3": "Lassen Sie die Schlüssel wie mit dem Gastgeber vereinbart zurück.", "contact_h": "Kontakt", "contact_1": "Bei Fragen oder Problemen rufen Sie den Gastgeber unter der angegebenen Nummer an. Wenn Sie ihn nicht erreichen, schreiben Sie den Eigentümern über WhatsApp. Wir sind von Montag bis Sonntag von 10:00 bis 19:00 Uhr erreichbar.", "wa": "Per WhatsApp schreiben", "thanks_1": "Teilen Sie gern Ihr positives Feedback auf der Plattform, über die Sie gebucht haben, oder direkt mit uns. Wenn Sie wieder zu Besuch kommen möchten, schreiben Sie uns für eine Direktbuchung.", "thanks_2": "Wir wünschen Ihnen einen wunderbaren Aufenthalt und hoffen, Sie wiederzusehen!", "n_appliances": "Geräte", "appliances_h": "Geräte", "appliances_1": "Anleitungen für Herd, Waschmaschine, Mikrowelle und weitere Geräte.", "ap_stove": "Herd", "ap_washer": "Waschmaschine", "ap_microwave": "Mikrowelle", "ap_soon": "Demnächst", "ap_dishwasher": "Geschirrspüler"}};
  const WASH = {"codes": ["ALGODÓN / ECO 40-60", "SINTÉTICOS", "MEZCLA", "COLOR", "LAVADO RÁPIDO 15'", "ROPA DE CAMA", "LANA/DELICADOS", "ACLARAR+CENTRIFUG.", "DESAGUAR/CENTRIFUG"], "text": {"en": {"h1": "Before you wash", "l1": ["Check the pockets: coins, keys, hairpins and lighters damage the drum and the pump.", "Zip up zippers and tie long laces.", "Put socks, bras and small items in a mesh bag (but do not wash the bag on its own).", "Do not overfill the drum: clothes should lie loosely. Bedding and blankets: no more than 2 kg at a time.", "Close the door until it clicks and make sure nothing is caught in the seal.", "Do not wash shoes, rubber-backed mats or anything stained with petrol or solvent."], "h2": "Detergent and softener", "tray_intro": "The drawer pulls out on the left, above the door. It has three compartments:", "tray": [["Left, large (II)", "Detergent, powder or liquid. Not above MAX."], ["Middle (flower)", "Fabric softener only. Not above MAX."], ["Right (I)", "Leave empty. It is only for the pre-wash."]], "tray_after": "Capsules and tablets do not go in the drawer: drop the capsule on the bottom of the empty drum and put the clothes on top. Wash wool and delicates with liquid detergent only. Use a little detergent: too much causes foam and leaks.", "warn_label": "Important:", "warn": "Never put dishwasher capsules or tablets in the washing machine, and never put laundry capsules in the dishwasher. They look alike but are different products. You can ruin your clothes, and the dishwasher will fill with foam.", "h3": "Program and start", "steps": ["Turn the dial to the program you want. The machine switches on by itself.", "If needed, change the temperature (thermometer button) and the spin speed (spiral button). Usually you do not need to.", "Press ▷‖ (Start/Pause)."], "prog_intro": "The labels on the machine are in Spanish:", "prog_head": ["What you are washing", "Dial setting"], "prog": ["Everyday clothes, towels, T-shirts", "Synthetics, sportswear", "Mixed load", "Coloured clothes that should not fade", "A few lightly soiled items, quick (up to 2 kg, 15 minutes)", "Sheets and duvet covers (up to 2 kg)", "Wool, silk, lingerie", "Rinse and spin only", "Drain and spin only"], "prog_note": "Do not worry if a wash takes 2‑3 hours: ECO 40‑60 and ALGODÓN really are that long.", "h4": "After washing", "l4": ["The door opens once the lock symbol disappears from the display. This can take a minute or two. Do not force it.", "Take the laundry out right away.", "Leave the door and the drawer slightly open so the machine can dry and does not smell.", "The machine switches off by itself. You do not need to touch the dial."], "h5": "If something goes wrong", "never_label": "Never:", "never": "open the door or the drawer during a wash, pull the plug in the middle of a cycle, or put anything on top of the machine.", "err_head": ["What you see", "What to do"], "err": [["Buttons do not respond and a padlock symbol with a little face is lit", "Child lock is on. Hold the thermometer and spiral buttons for 3 seconds."], ["dC", "The door is not closed. Close it firmly and check nothing is caught."], ["4C", "No water. Check that the tap behind the machine is open."], ["5C, LC, OC or any other code", "Press ▷‖. Do not take anything apart, just message us."], ["Water on the floor, smoke or a burning smell", "Turn the dial to off (⏻), close the tap and message us right away."]]}, "es": {"h1": "Antes de lavar", "l1": ["Revisa los bolsillos: monedas, llaves, horquillas y mecheros dañan el tambor y la bomba.", "Cierra las cremalleras y ata los cordones largos.", "Mete calcetines, sujetadores y prendas pequeñas en una bolsa de malla (pero no laves la bolsa sola).", "No llenes demasiado el tambor: la ropa debe quedar suelta. Ropa de cama y mantas: máximo 2 kg por lavado.", "Cierra la puerta hasta oír el clic y comprueba que no quede nada atrapado en la junta.", "No laves calzado, alfombrillas con base de goma ni prendas manchadas de gasolina o disolvente."], "h2": "Detergente y suavizante", "tray_intro": "El cajetín sale hacia la izquierda, encima de la puerta. Tiene tres compartimentos:", "tray": [["Izquierdo, grande (II)", "Detergente en polvo o líquido. Sin pasar de la marca MAX."], ["Central (flor)", "Solo suavizante. Sin pasar de la marca MAX."], ["Derecho (I)", "Déjalo vacío. Solo sirve para el prelavado."]], "tray_after": "Las cápsulas y pastillas no van en el cajetín: echa la cápsula en el fondo del tambor vacío y la ropa encima. La lana y las prendas delicadas, solo con detergente líquido. Usa poco detergente: de más hace espuma y provoca fugas.", "warn_label": "Atención:", "warn": "No pongas cápsulas ni pastillas de lavavajillas en la lavadora, ni cápsulas de lavadora en el lavavajillas. Se parecen, pero son productos distintos: puedes estropear la ropa y el lavavajillas se llenará de espuma.", "h3": "Programa e inicio", "steps": ["Gira el selector al programa que quieras. La lavadora se enciende sola.", "Si hace falta, cambia la temperatura (botón del termómetro) y el centrifugado (botón de la espiral). Normalmente no es necesario.", "Pulsa ▷‖ (Inicio/Pausa)."], "prog_intro": "Los textos de la lavadora están en español:", "prog_head": ["Qué lavas", "Programa en el selector"], "prog": ["Ropa de uso diario, toallas, camisetas", "Sintéticos, ropa deportiva", "Colada mixta", "Ropa de color que no debe desteñir", "Poca ropa poco sucia, rápido (hasta 2 kg, 15 minutos)", "Sábanas y fundas nórdicas (hasta 2 kg)", "Lana, seda, lencería", "Solo aclarar y centrifugar", "Solo vaciar el agua y centrifugar"], "prog_note": "No te preocupes si el lavado dura 2 o 3 horas: ECO 40‑60 y ALGODÓN son así de largos.", "h4": "Después del lavado", "l4": ["La puerta se abre cuando se apaga el símbolo del candado en la pantalla. Puede tardar uno o dos minutos. No tires de ella.", "Saca la ropa enseguida.", "Deja la puerta y el cajetín entreabiertos para que la lavadora se seque y no huela.", "La lavadora se apaga sola. No hace falta tocar el selector."], "h5": "Si algo no va bien", "never_label": "No hagas nunca esto:", "never": "abrir la puerta o el cajetín durante el lavado, desenchufar la lavadora en pleno ciclo o poner algo encima.", "err_head": ["Qué ves", "Qué hacer"], "err": [["Los botones no responden y se ve un candado con una carita", "Está activado el bloqueo infantil. Mantén pulsados los botones del termómetro y de la espiral durante 3 segundos."], ["dC", "La puerta no está cerrada. Ciérrala bien y comprueba que no haya nada atrapado."], ["4C", "No hay agua. Comprueba que el grifo de detrás de la lavadora esté abierto."], ["5C, LC, OC u otro código", "Pulsa ▷‖. No desmontes nada y escríbenos."], ["Agua en el suelo, humo u olor a quemado", "Gira el selector a apagado (⏻), cierra el grifo y escríbenos enseguida."]]}, "nl": {"h1": "Voor het wassen", "l1": ["Controleer de zakken: munten, sleutels, haarspelden en aanstekers beschadigen de trommel en de pomp.", "Doe ritsen dicht en knoop lange veters vast.", "Stop sokken, beha's en kleine dingen in een waszak (maar was de zak niet alleen).", "Vul de trommel niet te vol: de was moet ruimte hebben. Beddengoed en dekens: maximaal 2 kg per keer.", "Sluit de deur tot je een klik hoort en controleer dat niets bekneld zit in de rubberen rand.", "Was geen schoenen, matten met rubberen onderkant of kleding met vlekken van benzine of oplosmiddel."], "h2": "Wasmiddel en wasverzachter", "tray_intro": "Het laatje schuift naar links uit, boven de deur. Er zitten drie vakjes in:", "tray": [["Links, groot (II)", "Wasmiddel, poeder of vloeibaar. Niet boven MAX."], ["Midden (bloem)", "Alleen wasverzachter. Niet boven MAX."], ["Rechts (I)", "Leeg laten. Alleen voor de voorwas."]], "tray_after": "Capsules en tabletten gaan niet in het laatje: leg de capsule onderin de lege trommel en de was erbovenop. Wol en fijne was alleen met vloeibaar wasmiddel. Gebruik weinig wasmiddel: te veel geeft schuim en lekkage.", "warn_label": "Let op:", "warn": "Stop nooit vaatwascapsules of -tabletten in de wasmachine, en nooit wascapsules in de vaatwasser. Ze lijken op elkaar, maar het zijn andere producten. Je kunt kleding bederven en de vaatwasser loopt vol schuim.", "h3": "Programma en starten", "steps": ["Draai de knop naar het gewenste programma. De machine gaat vanzelf aan.", "Pas zo nodig de temperatuur (knop met thermometer) en het toerental (knop met spiraal) aan. Meestal is dat niet nodig.", "Druk op ▷‖ (Start/Pauze)."], "prog_intro": "De opschriften op de machine zijn in het Spaans:", "prog_head": ["Wat je wast", "Stand van de knop"], "prog": ["Dagelijkse kleding, handdoeken, T-shirts", "Synthetisch, sportkleding", "Gemengde was", "Gekleurde was die niet mag verkleuren", "Een paar licht vuile dingen, snel (tot 2 kg, 15 minuten)", "Lakens en dekbedovertrekken (tot 2 kg)", "Wol, zijde, lingerie", "Alleen spoelen en centrifugeren", "Alleen afpompen en centrifugeren"], "prog_note": "Schrik niet als een wasbeurt 2 tot 3 uur duurt: ECO 40‑60 en ALGODÓN zijn echt zo lang.", "h4": "Na het wassen", "l4": ["De deur gaat open zodra het slotsymbool op het scherm verdwijnt. Dat kan een minuut of twee duren. Trek er niet met geweld aan.", "Haal de was er meteen uit.", "Laat de deur en het laatje op een kier staan, zodat de machine droogt en niet gaat ruiken.", "De machine schakelt vanzelf uit. De knop hoef je niet aan te raken."], "h5": "Als er iets misgaat", "never_label": "Doe nooit het volgende:", "never": "de deur of het laatje openen tijdens het wassen, de stekker uit het stopcontact trekken tijdens een programma, of iets op de machine zetten.", "err_head": ["Wat je ziet", "Wat je moet doen"], "err": [["De knoppen reageren niet en er brandt een hangslotsymbool met een gezichtje", "Het kinderslot staat aan. Houd de knoppen met thermometer en spiraal 3 seconden ingedrukt."], ["dC", "De deur is niet dicht. Sluit hem goed en controleer dat niets bekneld zit."], ["4C", "Geen water. Controleer of de kraan achter de machine openstaat."], ["5C, LC, OC of een andere code", "Druk op ▷‖. Haal niets uit elkaar en stuur ons een bericht."], ["Water op de vloer, rook of een brandlucht", "Draai de knop op uit (⏻), sluit de kraan en stuur ons meteen een bericht."]]}, "fr": {"h1": "Avant de laver", "l1": ["Vérifiez les poches : pièces, clés, pinces à cheveux et briquets abîment le tambour et la pompe.", "Fermez les fermetures éclair et nouez les lacets longs.", "Mettez les chaussettes, les soutiens-gorge et les petites pièces dans un filet de lavage (mais ne lavez pas le filet seul).", "Ne surchargez pas le tambour : le linge doit rester à l'aise. Linge de lit et couvertures : 2 kg maximum par cycle.", "Fermez le hublot jusqu'au clic et vérifiez que rien n'est coincé dans le joint.", "Ne lavez pas de chaussures, de tapis à dos caoutchouté ni de vêtements tachés d'essence ou de solvant."], "h2": "Lessive et adoucissant", "tray_intro": "Le tiroir se tire vers la gauche, au-dessus du hublot. Il comporte trois compartiments :", "tray": [["Gauche, grand (II)", "Lessive en poudre ou liquide. Sans dépasser le repère MAX."], ["Milieu (fleur)", "Adoucissant uniquement. Sans dépasser le repère MAX."], ["Droite (I)", "À laisser vide. Réservé au prélavage."]], "tray_after": "Les capsules et les pastilles ne se mettent pas dans le tiroir : déposez la capsule au fond du tambour vide, puis le linge par-dessus. Laine et textiles délicats : uniquement avec de la lessive liquide. Utilisez peu de lessive : trop de produit provoque de la mousse et des fuites.", "warn_label": "Attention :", "warn": "Ne mettez jamais de capsules ou de pastilles pour lave-vaisselle dans le lave-linge, ni de capsules de lessive dans le lave-vaisselle. Elles se ressemblent, mais ce sont des produits différents : vous risquez d'abîmer votre linge, et le lave-vaisselle se remplira de mousse.", "h3": "Programme et démarrage", "steps": ["Tournez le sélecteur sur le programme voulu. La machine s'allume toute seule.", "Si besoin, modifiez la température (bouton thermomètre) et l'essorage (bouton spirale). En général, ce n'est pas nécessaire.", "Appuyez sur ▷‖ (Marche/Pause)."], "prog_intro": "Les inscriptions sur la machine sont en espagnol :", "prog_head": ["Ce que vous lavez", "Position du sélecteur"], "prog": ["Vêtements courants, serviettes, t-shirts", "Synthétiques, vêtements de sport", "Linge mélangé", "Couleurs, pour éviter qu'elles déteignent", "Quelques pièces peu sales, rapidement (jusqu'à 2 kg, 15 minutes)", "Draps et housses de couette (jusqu'à 2 kg)", "Laine, soie, lingerie", "Rinçage et essorage uniquement", "Vidange et essorage uniquement"], "prog_note": "Pas d'inquiétude si le lavage dure 2 à 3 heures : ECO 40‑60 et ALGODÓN sont vraiment aussi longs.", "h4": "Après le lavage", "l4": ["Le hublot s'ouvre quand le symbole du cadenas disparaît de l'écran. Cela peut prendre une ou deux minutes. Ne forcez pas.", "Sortez le linge tout de suite.", "Laissez le hublot et le tiroir entrouverts pour que la machine sèche et ne sente pas.", "La machine s'éteint toute seule. Inutile de toucher au sélecteur."], "h5": "En cas de problème", "never_label": "À ne jamais faire :", "never": "ouvrir le hublot ou le tiroir pendant le lavage, débrancher la machine en plein cycle, poser quoi que ce soit dessus.", "err_head": ["Ce que vous voyez", "Que faire"], "err": [["Les boutons ne répondent pas et un cadenas avec un petit visage est allumé", "La sécurité enfants est activée. Maintenez les boutons thermomètre et spirale pendant 3 secondes."], ["dC", "Le hublot n'est pas fermé. Fermez-le bien et vérifiez que rien n'est coincé."], ["4C", "Pas d'eau. Vérifiez que le robinet derrière la machine est ouvert."], ["5C, LC, OC ou tout autre code", "Appuyez sur ▷‖. Ne démontez rien et écrivez-nous."], ["Eau au sol, fumée ou odeur de brûlé", "Tournez le sélecteur sur arrêt (⏻), fermez le robinet et écrivez-nous tout de suite."]]}, "ru": {"h1": "Перед стиркой", "l1": ["Проверьте карманы: монеты, ключи, заколки и зажигалки ломают барабан и насос.", "Застегните молнии, завяжите длинные шнурки.", "Носки, бюстгальтеры и мелочь кладите в сетчатый мешок (но мешок не стирайте один).", "Не набивайте барабан: вещи должны лежать свободно. Постельное бельё и одеяла: не больше 2 кг за раз.", "Закройте дверцу до щелчка и проверьте, что ничего не зажато уплотнителем.", "Не стирайте обувь, коврики на резиновой основе и вещи, испачканные бензином или растворителем."], "h2": "Порошок и кондиционер", "tray_intro": "Лоток выдвигается слева над дверцей. В нём три отсека:", "tray": [["Левый большой (II)", "Порошок или жидкое средство для стирки. Не выше отметки MAX."], ["Средний (цветок)", "Только кондиционер. Не выше отметки MAX."], ["Правый (I)", "Ничего. Нужен только для предварительной стирки."]], "tray_after": "Капсулы и таблетки в лоток не кладут: капсулу бросьте на дно пустого барабана, вещи сверху. Шерсть и деликатное стирайте только жидким средством. Средства нужно немного, лишнее даёт пену и протечки.", "warn_label": "Внимание:", "warn": "Капсулы и таблетки для посудомойки в стиральную машину не кладите. И наоборот, стиральные капсулы не кладите в посудомойку. Выглядят похоже, но средства разные: можно испортить вещи, а посудомойку зальёт пеной.", "h3": "Программа и запуск", "steps": ["Поверните ручку на нужную программу, машина включится сама.", "Если надо, поменяйте температуру (кнопка с термометром) и отжим (кнопка со спиралью). Обычно не надо.", "Нажмите ▷‖ (Старт/Пауза)."], "prog_intro": "Надписи на машине испанские:", "prog_head": ["Что стираете", "Программа на ручке"], "prog": ["Обычные вещи, полотенца, футболки", "Синтетика, спортивная одежда", "Всё вперемешку", "Цветное, чтобы не полиняло", "Немного слегка грязных вещей, быстро (до 2 кг, 15 минут)", "Простыни, пододеяльники (до 2 кг)", "Шерсть, шёлк, бельё", "Только прополоскать и отжать", "Только слить воду и отжать"], "prog_note": "Не переживайте, если стирка длится 2‑3 часа: ECO 40‑60 и ALGODÓN действительно такие долгие.", "h4": "После стирки", "l4": ["Дверца откроется, когда на экране погаснет значок замка. Это может занять минуту-две, не тяните силой.", "Сразу достаньте вещи.", "Оставьте дверцу и лоток приоткрытыми, чтобы машина просохла и не пахла.", "Машина выключается сама, ручку можно не трогать."], "h5": "Если что-то не так", "never_label": "Нельзя:", "never": "открывать дверцу или лоток во время стирки, выдёргивать вилку из розетки на ходу, ставить что-либо на машину.", "err_head": ["На экране / что видите", "Что делать"], "err": [["Кнопки не реагируют, горит значок замочка с рожицей", "Включена защита от детей. Зажмите кнопки «термометр» и «спираль» на 3 секунды."], ["dC", "Дверца не закрыта. Закройте плотнее, проверьте, что ничего не зажато."], ["4C", "Нет воды. Проверьте, открыт ли кран за машиной."], ["5C, LC, OC или любой другой код", "Нажмите ▷‖, ничего не разбирайте и напишите нам."], ["Вода на полу, дым, запах гари", "Поверните ручку в положение «выкл.» (⏻), закройте кран и сразу напишите нам."]]}, "no": {"h1": "Før vask", "l1": ["Sjekk lommene: mynter, nøkler, hårnåler og lightere skader trommelen og pumpen.", "Lukk glidelåser og knyt lange snørebånd.", "Legg sokker, BH-er og småting i en vaskepose (men ikke vask posen alene).", "Ikke fyll trommelen for full: tøyet skal ligge løst. Sengetøy og dyner: maks. 2 kg om gangen.", "Lukk døren til den klikker, og sjekk at ingenting sitter fast i gummilisten.", "Ikke vask sko, matter med gummibunn eller tøy med flekker av bensin eller løsemiddel."], "h2": "Vaskemiddel og tøymykner", "tray_intro": "Skuffen trekkes ut mot venstre, over døren. Den har tre rom:", "tray": [["Venstre, stort (II)", "Vaskemiddel, pulver eller flytende. Ikke over MAX-streken."], ["Midten (blomst)", "Bare tøymykner. Ikke over MAX-streken."], ["Høyre (I)", "La stå tomt. Brukes bare til forvask."]], "tray_after": "Kapsler og tabletter skal ikke i skuffen: legg kapselen på bunnen av den tomme trommelen og tøyet oppå. Ull og finvask vaskes bare med flytende vaskemiddel. Bruk lite vaskemiddel: for mye gir skum og lekkasje.", "warn_label": "Viktig:", "warn": "Ikke legg oppvaskmaskinkapsler eller -tabletter i vaskemaskinen, og ikke legg vaskekapsler i oppvaskmaskinen. De ser like ut, men er ulike produkter. Du kan ødelegge tøyet, og oppvaskmaskinen fylles med skum.", "h3": "Program og start", "steps": ["Vri bryteren til ønsket program. Maskinen slår seg på av seg selv.", "Endre om nødvendig temperaturen (knappen med termometer) og sentrifugeringen (knappen med spiral). Vanligvis trenger du ikke det.", "Trykk ▷‖ (Start/Pause)."], "prog_intro": "Teksten på maskinen er på spansk:", "prog_head": ["Hva du vasker", "Innstilling på bryteren"], "prog": ["Hverdagsklær, håndklær, T-skjorter", "Syntetisk, treningstøy", "Blandet vask", "Farget tøy som ikke skal blekne", "Noen få lett skitne plagg, raskt (opptil 2 kg, 15 minutter)", "Laken og dynetrekk (opptil 2 kg)", "Ull, silke, undertøy", "Bare skylling og sentrifugering", "Bare tømming og sentrifugering"], "prog_note": "Ikke bli bekymret om vasken tar 2‑3 timer: ECO 40‑60 og ALGODÓN er faktisk så lange.", "h4": "Etter vask", "l4": ["Døren åpner seg når låsesymbolet slukker på displayet. Det kan ta et par minutter. Ikke bruk makt.", "Ta tøyet ut med en gang.", "La døren og skuffen stå på gløtt, så maskinen tørker og ikke lukter.", "Maskinen slår seg av selv. Du trenger ikke røre bryteren."], "h5": "Hvis noe går galt", "never_label": "Aldri:", "never": "åpne døren eller skuffen under vask, trekke ut støpselet midt i et program, eller sette noe oppå maskinen.", "err_head": ["Hva du ser", "Hva du gjør"], "err": [["Knappene reagerer ikke, og et hengelåssymbol med et lite ansikt lyser", "Barnesikringen er på. Hold inne knappene med termometer og spiral i 3 sekunder."], ["dC", "Døren er ikke lukket. Lukk den godt og sjekk at ingenting sitter fast."], ["4C", "Det kommer ikke vann. Sjekk at kranen bak maskinen er åpen."], ["5C, LC, OC eller en annen kode", "Trykk ▷‖. Ikke ta noe fra hverandre, send oss en melding."], ["Vann på gulvet, røyk eller brannlukt", "Vri bryteren til av (⏻), steng kranen og send oss en melding med en gang."]]}, "sv": {"h1": "Före tvätt", "l1": ["Kolla fickorna: mynt, nycklar, hårnålar och tändare skadar trumman och pumpen.", "Dra igen dragkedjor och knyt långa snören.", "Lägg strumpor, bh:ar och småsaker i en tvättpåse (men tvätta inte påsen ensam).", "Fyll inte trumman för mycket: kläderna ska ligga löst. Sängkläder och täcken: max 2 kg åt gången.", "Stäng luckan tills det klickar och kontrollera att inget har fastnat i gummilisten.", "Tvätta inte skor, mattor med gummibaksida eller kläder med fläckar av bensin eller lösningsmedel."], "h2": "Tvättmedel och sköljmedel", "tray_intro": "Lådan dras ut åt vänster, ovanför luckan. Den har tre fack:", "tray": [["Vänster, stort (II)", "Tvättmedel, pulver eller flytande. Inte över MAX-märket."], ["Mitten (blomma)", "Bara sköljmedel. Inte över MAX-märket."], ["Höger (I)", "Lämna tomt. Används bara för förtvätt."]], "tray_after": "Kapslar och tabletter ska inte i lådan: lägg kapseln på botten av den tomma trumman och kläderna ovanpå. Ull och fintvätt tvättas bara med flytande tvättmedel. Använd lite tvättmedel: för mycket ger skum och läckage.", "warn_label": "Viktigt:", "warn": "Lägg aldrig diskmaskinskapslar eller -tabletter i tvättmaskinen, och lägg inte tvättkapslar i diskmaskinen. De ser lika ut men är olika produkter. Du kan förstöra kläderna, och diskmaskinen fylls med skum.", "h3": "Program och start", "steps": ["Vrid ratten till önskat program. Maskinen slås på av sig själv.", "Ändra vid behov temperaturen (knappen med termometer) och centrifugeringen (knappen med spiral). Oftast behövs det inte.", "Tryck på ▷‖ (Start/Paus)."], "prog_intro": "Texterna på maskinen är på spanska:", "prog_head": ["Vad du tvättar", "Läge på ratten"], "prog": ["Vardagskläder, handdukar, t-shirts", "Syntet, träningskläder", "Blandad tvätt", "Färgat som inte ska blekna", "Några få lätt smutsiga plagg, snabbt (upp till 2 kg, 15 minuter)", "Lakan och påslakan (upp till 2 kg)", "Ull, siden, underkläder", "Endast sköljning och centrifugering", "Endast avpumpning och centrifugering"], "prog_note": "Oroa dig inte om tvätten tar 2‑3 timmar: ECO 40‑60 och ALGODÓN är verkligen så långa.", "h4": "Efter tvätten", "l4": ["Luckan går att öppna när låssymbolen slocknar i displayen. Det kan ta en minut eller två. Använd inte våld.", "Ta ut tvätten direkt.", "Låt luckan och lådan stå på glänt så att maskinen torkar och inte luktar.", "Maskinen stängs av av sig själv. Du behöver inte röra ratten."], "h5": "Om något går fel", "never_label": "Aldrig:", "never": "öppna luckan eller lådan under tvätten, dra ur kontakten mitt i ett program eller ställa något ovanpå maskinen.", "err_head": ["Vad du ser", "Vad du gör"], "err": [["Knapparna reagerar inte och en hänglåssymbol med ett litet ansikte lyser", "Barnlåset är på. Håll in knapparna med termometer och spiral i 3 sekunder."], ["dC", "Luckan är inte stängd. Stäng den ordentligt och kontrollera att inget har fastnat."], ["4C", "Inget vatten. Kontrollera att kranen bakom maskinen är öppen."], ["5C, LC, OC eller någon annan kod", "Tryck på ▷‖. Plocka inte isär något, skriv till oss."], ["Vatten på golvet, rök eller brandlukt", "Vrid ratten till av (⏻), stäng kranen och skriv till oss direkt."]]}, "fi": {"h1": "Ennen pesua", "l1": ["Tarkista taskut: kolikot, avaimet, hiuspinnit ja sytyttimet vahingoittavat rumpua ja pumppua.", "Sulje vetoketjut ja solmi pitkät nauhat.", "Laita sukat, rintaliivit ja pienet vaatteet pesupussiin (mutta älä pese pussia yksin).", "Älä täytä rumpua liikaa: vaatteiden pitää mahtua liikkumaan. Lakanat ja peitot: enintään 2 kg kerralla.", "Sulje luukku, kunnes se napsahtaa, ja varmista, ettei mikään jää tiivisteen väliin.", "Älä pese kenkiä, kumipohjaisia mattoja äläkä bensiinillä tai liuottimella tahriutuneita vaatteita."], "h2": "Pesuaine ja huuhteluaine", "tray_intro": "Pesuainelokero vedetään ulos vasemmalle luukun yläpuolelta. Siinä on kolme lokeroa:", "tray": [["Vasen, suuri (II)", "Pesuaine, jauhe tai neste. Ei MAX-merkin yli."], ["Keskimmäinen (kukka)", "Vain huuhteluaine. Ei MAX-merkin yli."], ["Oikea (I)", "Jätä tyhjäksi. Vain esipesua varten."]], "tray_after": "Kapselit ja tabletit eivät kuulu lokeroon: pudota kapseli tyhjän rummun pohjalle ja laita vaatteet päälle. Villa ja arat vaatteet pestään vain nestemäisellä pesuaineella. Käytä pesuainetta vähän: liika aiheuttaa vaahtoa ja vuotoja.", "warn_label": "Huomio:", "warn": "Älä laita astianpesukoneen kapseleita tai tabletteja pesukoneeseen äläkä pyykinpesukapseleita astianpesukoneeseen. Ne näyttävät samalta, mutta ovat eri tuotteita. Vaatteet voivat pilaantua, ja astianpesukone täyttyy vaahdosta.", "h3": "Ohjelma ja käynnistys", "steps": ["Käännä valitsin haluamaasi ohjelmaan. Kone käynnistyy itsestään.", "Muuta tarvittaessa lämpötilaa (lämpömittarinappi) ja linkousta (kierrenappi). Yleensä se ei ole tarpeen.", "Paina ▷‖ (Käynnistys/Tauko)."], "prog_intro": "Koneen tekstit ovat espanjaksi:", "prog_head": ["Mitä peset", "Valitsimen asento"], "prog": ["Päivittäiset vaatteet, pyyhkeet, t-paidat", "Synteettiset, urheiluvaatteet", "Sekapyykki", "Värilliset, jotka eivät saa haalistua", "Muutama vähän likainen vaate nopeasti (enintään 2 kg, 15 minuuttia)", "Lakanat ja pussilakanat (enintään 2 kg)", "Villa, silkki, alusvaatteet", "Vain huuhtelu ja linkous", "Vain tyhjennys ja linkous"], "prog_note": "Älä huolestu, jos pesu kestää 2‑3 tuntia: ECO 40‑60 ja ALGODÓN ovat oikeasti niin pitkiä.", "h4": "Pesun jälkeen", "l4": ["Luukku aukeaa, kun lukkosymboli sammuu näytöltä. Siihen voi mennä minuutti tai kaksi. Älä vedä väkisin.", "Ota pyykki heti pois.", "Jätä luukku ja lokero raolleen, jotta kone kuivuu eikä haise.", "Kone sammuu itsestään. Valitsinta ei tarvitse koskea."], "h5": "Jos jokin menee pieleen", "never_label": "Älä koskaan:", "never": "avaa luukkua tai lokeroa pesun aikana, vedä pistoketta seinästä kesken ohjelman tai aseta mitään koneen päälle.", "err_head": ["Mitä näet", "Mitä tehdä"], "err": [["Painikkeet eivät reagoi ja lukkosymboli, jossa on pieni naama, palaa", "Lapsilukko on päällä. Pidä lämpömittari- ja kierrenappia painettuna 3 sekuntia."], ["dC", "Luukku ei ole kiinni. Sulje se kunnolla ja tarkista, ettei mikään jää väliin."], ["4C", "Vettä ei tule. Tarkista, että koneen takana oleva hana on auki."], ["5C, LC, OC tai mikä tahansa muu koodi", "Paina ▷‖. Älä pura mitään, vaan lähetä meille viesti."], ["Vettä lattialla, savua tai palaneen haju", "Käännä valitsin pois päältä (⏻), sulje hana ja lähetä meille heti viesti."]]}, "de": {"h1": "Vor dem Waschen", "l1": ["Taschen kontrollieren: Münzen, Schlüssel, Haarklammern und Feuerzeuge beschädigen Trommel und Pumpe.", "Reißverschlüsse schließen und lange Schnürsenkel zubinden.", "Socken, BHs und Kleinteile in ein Wäschenetz legen (das Netz aber nicht allein waschen).", "Trommel nicht überfüllen: Die Wäsche muss locker liegen. Bettwäsche und Decken: höchstens 2 kg pro Waschgang.", "Tür schließen, bis sie einrastet, und prüfen, dass nichts in der Dichtung eingeklemmt ist.", "Keine Schuhe, Matten mit Gummirücken oder mit Benzin oder Lösungsmittel verschmutzte Kleidung waschen."], "h2": "Waschmittel und Weichspüler", "tray_intro": "Die Schublade lässt sich links über der Tür herausziehen. Sie hat drei Fächer:", "tray": [["Links, groß (II)", "Waschmittel, Pulver oder flüssig. Nicht über die MAX-Markierung hinaus."], ["Mitte (Blume)", "Nur Weichspüler. Nicht über die MAX-Markierung hinaus."], ["Rechts (I)", "Leer lassen. Nur für die Vorwäsche."]], "tray_after": "Kapseln und Tabs gehören nicht in die Schublade: Legen Sie die Kapsel auf den Boden der leeren Trommel und die Wäsche darauf. Wolle und Feinwäsche nur mit Flüssigwaschmittel waschen. Wenig Waschmittel genügt: Zu viel führt zu Schaum und Undichtigkeiten.", "warn_label": "Achtung:", "warn": "Geben Sie niemals Spülmaschinen-Tabs oder -Kapseln in die Waschmaschine und keine Waschmittelkapseln in die Spülmaschine. Sie sehen ähnlich aus, sind aber verschiedene Produkte. Die Wäsche kann Schaden nehmen, und die Spülmaschine läuft voll Schaum.", "h3": "Programm und Start", "steps": ["Drehen Sie den Programmwähler auf das gewünschte Programm. Die Maschine schaltet sich von selbst ein.", "Ändern Sie bei Bedarf die Temperatur (Thermometer-Taste) und die Schleuderdrehzahl (Spiral-Taste). Meist ist das nicht nötig.", "Drücken Sie ▷‖ (Start/Pause)."], "prog_intro": "Die Beschriftung an der Maschine ist auf Spanisch:", "prog_head": ["Was Sie waschen", "Stellung des Wählers"], "prog": ["Alltagskleidung, Handtücher, T-Shirts", "Synthetik, Sportkleidung", "Mischwäsche", "Buntes, das nicht ausbleichen soll", "Wenige leicht verschmutzte Teile, schnell (bis 2 kg, 15 Minuten)", "Laken und Bettbezüge (bis 2 kg)", "Wolle, Seide, Dessous", "Nur spülen und schleudern", "Nur abpumpen und schleudern"], "prog_note": "Keine Sorge, wenn ein Waschgang 2 bis 3 Stunden dauert: ECO 40‑60 und ALGODÓN sind wirklich so lang.", "h4": "Nach dem Waschen", "l4": ["Die Tür öffnet sich, sobald das Schloss-Symbol im Display erlischt. Das kann ein bis zwei Minuten dauern. Nicht mit Gewalt aufziehen.", "Nehmen Sie die Wäsche sofort heraus.", "Lassen Sie Tür und Schublade einen Spalt offen, damit die Maschine trocknet und nicht riecht.", "Die Maschine schaltet sich von selbst aus. Den Wähler müssen Sie nicht berühren."], "h5": "Wenn etwas nicht stimmt", "never_label": "Niemals:", "never": "die Tür oder die Schublade während des Waschens öffnen, mitten im Programm den Stecker ziehen oder etwas auf die Maschine stellen.", "err_head": ["Was Sie sehen", "Was zu tun ist"], "err": [["Die Tasten reagieren nicht und ein Vorhängeschloss mit Gesicht leuchtet", "Die Kindersicherung ist aktiv. Halten Sie die Thermometer- und die Spiral-Taste 3 Sekunden gedrückt."], ["dC", "Die Tür ist nicht geschlossen. Schließen Sie sie fest und prüfen Sie, dass nichts eingeklemmt ist."], ["4C", "Kein Wasser. Prüfen Sie, ob der Wasserhahn hinter der Maschine offen ist."], ["5C, LC, OC oder ein anderer Code", "Drücken Sie ▷‖. Bauen Sie nichts auseinander, sondern schreiben Sie uns."], ["Wasser auf dem Boden, Rauch oder Brandgeruch", "Drehen Sie den Wähler auf Aus (⏻), schließen Sie den Hahn und schreiben Sie uns sofort."]]}}};
  const DISH = {"codes": ["Eco 50°", "Auto 45-65°", "Intensivo 70°", "Rápido / 1 h", "Prelavado"], "text": {"en": {"h1": "Before loading", "l1": ["Scrape food leftovers into the bin: bones, pits, rice and napkins clog the filter. You do not need to rinse under the tap.", "Put plates in the lower rack facing the centre, and cups and glasses in the upper rack upside down.", "Forks and spoons go in the cutlery basket, knives with the point down.", "Check that nothing blocks the spray arms (the blades at the top and bottom) and spin them by hand.", "Do not wash in the machine: wooden boards and spoons, cast iron"], "h2": "The tablet", "intro2": "On the inside of the door there is a dispenser with a lid. Put in one dishwasher tablet and close the lid until it clicks.", "rule_label": "Main rule:", "rule": "only dishwasher tablets or powder.", "l2": ["Regular dish soap (Fairy and similar), even a couple of drops, makes a mountain of foam that will flow out onto the floor.", "Laundry capsules must not go in here either, and the other way round.", "You do not need to add salt or rinse aid, we take care of that. If the salt or rinse aid symbol lights up on the panel, just message us."], "h3": "Program and start", "steps": ["Switch the machine on with the power button.", "Choose a program with the program button.", "Press Start and close the door."], "prog_intro": "Program names are in Spanish:", "prog_head": ["What you are washing", "Program"], "prog": ["Everyday dishes after a meal", "Not sure what to choose", "Pots, pans, burnt-on food", "Lightly soiled dishes, in a hurry", "Rinse only, to let dishes wait until the machine is full"], "prog_note": "Eco takes about 3.5 hours. That is normal: it is the most economical one.", "h4": "After the wash", "l4": ["Do not open the door in the middle of a program: there is hot steam inside. If you really must, open it a crack and wait a couple of seconds.", "When it finishes, give the dishes 10‑15 minutes to cool. They will finish drying on their own.", "Unload the lower rack first, then the upper one, otherwise water from the cups will drip onto clean plates.", "Leave the door slightly open so the machine can dry out."], "hf": "How to clean the filter", "hf_note": "(if dishes are not coming out clean or there is water at the bottom)", "fsteps": ["Switch the machine off and take out the lower rack.", "In the centre of the bottom there is a round filter. Turn it counter-clockwise and lift it out together with the flat mesh underneath.", "Rinse everything under the tap and put food scraps in the bin, not down the sink.", "Put it back and turn clockwise as far as it goes. Never run the machine without the filter or with it only partly tightened."], "h5": "If something goes wrong", "err_head": ["What you see", "What to do"], "err": [["Buttons do not respond", "The button lock is on. Find the button with a key symbol or the label “3 seg” and hold it for 3‑4 seconds until the symbol goes out."], ["A code with the letter E on the display (for example E:15)", "Take a photo of the code. Switch the machine off with the power button and message us."], ["Foam or water on the floor", "Switch the machine off, close the tap and message us right away."], ["Water standing at the bottom after the wash", "The filter is clogged. Clean it as described above."]]}, "es": {"h1": "Antes de cargar", "l1": ["Tira los restos de comida a la basura: huesos, pipas, arroz y servilletas atascan el filtro. No hace falta aclarar bajo el grifo.", "Coloca los platos en el cesto inferior, con la cara hacia el centro, y las tazas y los vasos en el superior, boca abajo.", "Los tenedores y las cucharas, en el cesto de cubiertos; los cuchillos, con la punta hacia abajo.", "Comprueba que nada impida girar los brazos aspersores (las aspas de arriba y de abajo) y hazlos girar con la mano.", "No metas en la máquina: tablas y cucharas de madera, hierro fundido"], "h2": "La pastilla", "intro2": "En la cara interior de la puerta hay un dosificador con tapa. Pon una pastilla para lavavajillas y cierra la tapa hasta oír el clic.", "rule_label": "Regla principal:", "rule": "solo pastillas o detergente en polvo para lavavajillas.", "l2": ["El lavavajillas de mano (tipo Fairy), aunque sean un par de gotas, hace una montaña de espuma que acaba en el suelo.", "Tampoco se pueden usar cápsulas de lavadora, y al revés.", "No hace falta añadir sal ni abrillantador: lo hacemos nosotros. Si en el panel se enciende el símbolo de la sal o del abrillantador, escríbenos."], "h3": "Programa e inicio", "steps": ["Enciende la máquina con el botón de encendido.", "Elige un programa con el botón de programas.", "Pulsa Inicio y cierra la puerta."], "prog_intro": "Los nombres de los programas están en español:", "prog_head": ["Qué lavas", "Programa"], "prog": ["Vajilla normal después de comer", "No sabes cuál elegir", "Ollas, sartenes, comida pegada", "Vajilla poco sucia y con prisa", "Solo aclarar, para que la vajilla espere hasta llenar la máquina"], "prog_note": "Eco dura unas 3,5 horas. Es normal: es el programa más económico.", "h4": "Después del lavado", "l4": ["No abras la puerta a mitad de programa: dentro hay vapor caliente. Si es imprescindible, ábrela un poco y espera un par de segundos.", "Al terminar, deja que la vajilla se enfríe 10‑15 minutos y acabará de secarse sola.", "Vacía primero el cesto inferior y luego el superior; si no, el agua de las tazas caerá sobre los platos limpios.", "Deja la puerta entreabierta para que la máquina se seque."], "hf": "Cómo limpiar el filtro", "hf_note": "(si la vajilla no queda bien limpia o hay agua en el fondo)", "fsteps": ["Apaga la máquina y saca el cesto inferior.", "En el centro del fondo hay un filtro redondo. Gíralo en sentido contrario a las agujas del reloj y sácalo hacia arriba junto con la malla plana que hay debajo.", "Lávalo todo bajo el grifo y tira los restos de comida a la basura, no al fregadero.", "Vuelve a colocarlo y gíralo en el sentido de las agujas del reloj hasta el tope. No uses la máquina sin filtro o con el filtro mal apretado."], "h5": "Si algo no va bien", "err_head": ["Qué ves", "Qué hacer"], "err": [["Los botones no responden", "Está activado el bloqueo de botones. Busca el botón con el símbolo de la llave o la indicación «3 seg» y mantenlo pulsado 3‑4 segundos, hasta que se apague el símbolo."], ["En la pantalla aparece un código con la letra E (por ejemplo, E:15)", "Haz una foto del código. Apaga la máquina con el botón de encendido y escríbenos."], ["Espuma o agua en el suelo", "Apaga la máquina, cierra el grifo y escríbenos enseguida."], ["Queda agua en el fondo después del lavado", "El filtro está atascado. Límpialo como se explica más arriba."]]}, "nl": {"h1": "Voor het inladen", "l1": ["Gooi etensresten in de prullenbak: botten, pitten, rijst en servetten verstoppen het filter. Afspoelen onder de kraan hoeft niet.", "Zet borden in het onderste rek met de voorkant naar het midden, en kopjes en glazen ondersteboven in het bovenste rek.", "Vorken en lepels gaan in het bestekmandje, messen met de punt naar beneden.", "Controleer of niets de sproeiarmen (de bladen boven en onder) blokkeert en draai ze met de hand rond.", "Wat niet in de machine mag: houten planken en lepels, gietijzer"], "h2": "De tablet", "intro2": "Aan de binnenkant van de deur zit een doseerbakje met deksel. Doe er één vaatwastablet in en sluit het deksel tot het klikt.", "rule_label": "Belangrijkste regel:", "rule": "gebruik alleen vaatwastabletten of vaatwaspoeder.", "l2": ["Gewoon afwasmiddel voor de handafwas geeft al met een paar druppels een berg schuim, die over de vloer stroomt.", "Ook wascapsules voor de wasmachine horen hier niet, en andersom.", "Zout en glansspoelmiddel hoef je niet bij te vullen, dat doen wij. Gaat het zout- of glansspoelsymbool op het paneel branden, stuur ons dan gewoon een bericht."], "h3": "Programma en starten", "steps": ["Zet de machine aan met de aan/uit-knop.", "Kies een programma met de programmaknop.", "Druk op Start en sluit de deur."], "prog_intro": "De programmanamen zijn in het Spaans:", "prog_head": ["Wat je afwast", "Programma"], "prog": ["Gewone vaat na het eten", "Je weet niet wat je moet kiezen", "Pannen en aangebrande resten", "Licht vuile vaat, snel klaar", "Alleen spoelen, zodat de vaat kan wachten tot de machine vol is"], "prog_note": "Eco duurt ongeveer 3,5 uur. Dat is normaal: het is het zuinigste programma.", "h4": "Na het afwassen", "l4": ["Open de deur niet midden in een programma: binnenin zit hete stoom. Moet het echt, open hem dan op een kier en wacht een paar seconden.", "Laat de vaat na afloop 10‑15 minuten afkoelen, dan droogt hij vanzelf af.", "Ruim eerst het onderste rek uit en dan het bovenste, anders druipt het water van de kopjes op de schone borden.", "Laat de deur op een kier staan, zodat de machine kan drogen."], "hf": "Het filter schoonmaken", "hf_note": "(als de vaat niet schoon wordt of er water onderin blijft staan)", "fsteps": ["Zet de machine uit en haal het onderste rek eruit.", "Onderin het midden zit een rond filter. Draai het linksom en til het omhoog, samen met het platte gaas eronder.", "Spoel alles af onder de kraan en gooi etensresten in de prullenbak, niet in de gootsteen.", "Plaats het terug en draai het rechtsom tot het niet verder gaat. Gebruik de machine nooit zonder filter of met een los filter."], "h5": "Als er iets misgaat", "err_head": ["Wat je ziet", "Wat je moet doen"], "err": [["De knoppen reageren niet", "De knopvergrendeling staat aan. Zoek de knop met het sleutelsymbool of het opschrift “3 seg” en houd hem 3‑4 seconden ingedrukt, tot het symbool dooft."], ["Op het scherm staat een code met de letter E (bijvoorbeeld E:15)", "Maak een foto van de code. Zet de machine uit met de aan/uit-knop en stuur ons een bericht."], ["Schuim of water op de vloer", "Zet de machine uit, draai de kraan dicht en stuur ons meteen een bericht."], ["Na het afwassen blijft er water onderin staan", "Het filter zit verstopt. Maak het schoon zoals hierboven beschreven."]]}, "fr": {"h1": "Avant de charger", "l1": ["Jetez les restes de nourriture à la poubelle : os, noyaux, riz et serviettes en papier bouchent le filtre. Inutile de rincer sous le robinet.", "Placez les assiettes dans le panier du bas, face vers le centre, et les tasses et les verres dans le panier du haut, à l'envers.", "Fourchettes et cuillères dans le panier à couverts, couteaux pointe vers le bas.", "Vérifiez que rien ne gêne la rotation des bras de lavage (les pales du haut et du bas) et faites-les tourner à la main.", "Ne mettez pas dans la machine : planches et cuillères en bois, fonte"], "h2": "La pastille", "intro2": "À l'intérieur de la porte se trouve un distributeur avec couvercle. Mettez-y une pastille pour lave-vaisselle et fermez le couvercle jusqu'au clic.", "rule_label": "Règle d'or :", "rule": "uniquement des pastilles ou de la poudre pour lave-vaisselle.", "l2": ["Le liquide vaisselle ordinaire (type Fairy), même quelques gouttes, produit une montagne de mousse qui déborde sur le sol.", "Les capsules pour lave-linge ne vont pas non plus ici, et inversement.", "Pas besoin d'ajouter du sel ni du liquide de rinçage, nous nous en occupons. Si le symbole du sel ou du liquide de rinçage s'allume sur le bandeau, écrivez-nous simplement."], "h3": "Programme et démarrage", "steps": ["Allumez la machine avec le bouton marche.", "Choisissez un programme avec le bouton des programmes.", "Appuyez sur Start et fermez la porte."], "prog_intro": "Les noms des programmes sont en espagnol :", "prog_head": ["Ce que vous lavez", "Programme"], "prog": ["Vaisselle courante après le repas", "Vous ne savez pas quoi choisir", "Casseroles, poêles, aliments brûlés", "Vaisselle peu sale, quand on est pressé", "Simple rinçage, pour laisser la vaisselle attendre que la machine soit pleine"], "prog_note": "Eco dure environ 3 h 30. C'est normal : c'est le programme le plus économique.", "h4": "Après le lavage", "l4": ["N'ouvrez pas la porte en plein programme : la vapeur à l'intérieur est brûlante. Si c'est vraiment nécessaire, entrouvrez-la et patientez quelques secondes.", "Une fois le cycle terminé, laissez la vaisselle refroidir 10 à 15 minutes : elle finira de sécher toute seule.", "Videz d'abord le panier du bas, puis celui du haut, sinon l'eau des tasses gouttera sur les assiettes propres.", "Laissez la porte entrouverte pour que la machine sèche."], "hf": "Nettoyer le filtre", "hf_note": "(si la vaisselle est mal lavée ou s'il reste de l'eau au fond)", "fsteps": ["Éteignez la machine et sortez le panier du bas.", "Au centre du fond se trouve un filtre rond. Tournez-le dans le sens inverse des aiguilles d'une montre et retirez-le vers le haut avec la grille plate située dessous.", "Rincez le tout sous le robinet et jetez les restes de nourriture à la poubelle, pas dans l'évier.", "Remettez-le en place et tournez-le dans le sens des aiguilles d'une montre jusqu'en butée. Ne faites jamais fonctionner la machine sans filtre ou avec un filtre mal serré."], "h5": "En cas de problème", "err_head": ["Ce que vous voyez", "Que faire"], "err": [["Les boutons ne répondent pas", "Le verrouillage des touches est activé. Repérez la touche avec le symbole de clé ou l'inscription « 3 seg » et maintenez-la 3 à 4 secondes, jusqu'à ce que le symbole s'éteigne."], ["Un code avec la lettre E s'affiche (par exemple E:15)", "Prenez le code en photo. Éteignez la machine avec le bouton marche et écrivez-nous."], ["Mousse ou eau au sol", "Éteignez la machine, fermez le robinet et écrivez-nous tout de suite."], ["De l'eau reste au fond après le lavage", "Le filtre est bouché. Nettoyez-le comme expliqué ci-dessus."]]}, "ru": {"h1": "Перед загрузкой", "l1": ["Стряхните остатки еды в мусор: кости, косточки, рис и салфетки забивают фильтр. Споласкивать под краном не нужно.", "Тарелки ставьте в нижнюю корзину лицом к центру, чашки и стаканы в верхнюю вверх дном.", "Вилки и ложки в корзинку для приборов, ножи остриём вниз.", "Проверьте, что ничего не мешает вращаться разбрызгивателям (лопастям сверху и снизу), прокрутите их рукой.", "Не мойте в машине: деревянные доски и ложки, чугун"], "h2": "Таблетка", "intro2": "На внутренней стороне дверцы есть дозатор с крышкой. Положите туда одну таблетку для посудомойки и закройте крышку до щелчка.", "rule_label": "Главное правило:", "rule": "только таблетки или порошок для посудомоечных машин.", "l2": ["Обычное средство для мытья посуды (Fairy и подобные) даже пара капель даст гору пены, она вытечет на пол.", "Капсулы для стиральной машины сюда тоже нельзя, и наоборот.", "Соль и ополаскиватель досыпать не нужно, это делаем мы. Если на панели загорелся значок соли или ополаскивателя, просто напишите нам."], "h3": "Программа и запуск", "steps": ["Включите машину кнопкой питания.", "Выберите программу кнопкой программ.", "Нажмите Старт и закройте дверцу."], "prog_intro": "Названия программ испанские:", "prog_head": ["Что моете", "Программа"], "prog": ["Обычная посуда после еды", "Не знаете, что выбрать", "Кастрюли, сковородки, пригоревшее", "Слегка грязная посуда, нужно быстро", "Только сполоснуть, чтобы посуда постояла до полной загрузки"], "prog_note": "Eco длится около 3,5 часов. Это нормально: она самая экономная.", "h4": "После мойки", "l4": ["Не открывайте дверцу посреди программы: внутри горячий пар. Если очень нужно, приоткройте и подождите пару секунд.", "После окончания дайте посуде 10‑15 минут остыть, она досохнет сама.", "Разгружайте сначала нижнюю корзину, потом верхнюю, иначе вода с чашек капнет на чистые тарелки.", "Оставьте дверцу приоткрытой, чтобы машина просохла."], "hf": "Как почистить фильтр", "hf_note": "(если посуда плохо отмывается или внизу стоит вода)", "fsteps": ["Выключите машину и выньте нижнюю корзину.", "На дне в центре стоит круглый фильтр. Поверните его против часовой стрелки и вытащите вверх вместе с плоской сеткой под ним.", "Промойте всё под краном, остатки еды выбросьте в мусор, а не в раковину.", "Поставьте обратно и поверните по часовой стрелке до упора. Без фильтра или с недокрученным фильтром машину не включайте."], "h5": "Если что-то не так", "err_head": ["Что видите", "Что делать"], "err": [["Кнопки не нажимаются", "Включена блокировка кнопок. Найдите кнопку со значком ключа или подписью «3 seg» и держите её 3‑4 секунды, пока значок не погаснет."], ["На экране код с буквой E (например E:15)", "Код сфотографируйте. Выключите машину кнопкой питания и напишите нам."], ["Пена или вода на полу", "Выключите машину, закройте кран и сразу напишите нам."], ["Внизу после мойки стоит вода", "Забился фильтр. Почистите его, как написано выше."]]}, "no": {"h1": "Før du fyller maskinen", "l1": ["Skrap matrester i søpla: bein, steiner, ris og servietter tetter filteret. Du trenger ikke skylle under springen.", "Sett tallerkener i nederste kurv med forsiden mot midten, og kopper og glass i øverste kurv opp ned.", "Gafler og skjeer i bestikkurven, kniver med spissen ned.", "Sjekk at ingenting hindrer spylearmene (vingene øverst og nederst) i å snurre, og snurr dem rundt for hånd.", "Ikke legg i maskinen: tretavler og treskjeer, støpejern"], "h2": "Tabletten", "intro2": "På innsiden av døren er det en dispenser med lokk. Legg i én oppvasktablett og lukk lokket til det klikker.", "rule_label": "Hovedregelen:", "rule": "bare oppvasktabletter eller oppvaskmaskinpulver.", "l2": ["Vanlig oppvaskmiddel til håndoppvask gir et fjell av skum selv med noen få dråper, og det renner ut på gulvet.", "Vaskekapsler til vaskemaskinen skal heller ikke i oppvaskmaskinen, og omvendt.", "Du trenger ikke etterfylle salt eller glansmiddel, det gjør vi. Hvis symbolet for salt eller glansmiddel lyser på panelet, bare send oss en melding."], "h3": "Program og start", "steps": ["Slå på maskinen med strømknappen.", "Velg program med programknappen.", "Trykk Start og lukk døren."], "prog_intro": "Programnavnene er på spansk:", "prog_head": ["Hva du vasker", "Program"], "prog": ["Vanlig oppvask etter et måltid", "Du vet ikke hva du skal velge", "Kjeler, panner og inntørket mat", "Lett skitten oppvask, når det haster", "Bare skylling, så oppvasken kan vente til maskinen er full"], "prog_note": "Eco tar omtrent 3,5 timer. Det er normalt: det er det mest sparsomme programmet.", "h4": "Etter oppvasken", "l4": ["Ikke åpne døren midt i et program: det er varm damp inni. Må du, åpne en liten sprekk og vent et par sekunder.", "Når programmet er ferdig, la oppvasken kjøle seg ned i 10‑15 minutter, så tørker den ferdig av seg selv.", "Tøm nederste kurv først og deretter øverste, ellers drypper vann fra koppene ned på rene tallerkener.", "La døren stå på gløtt så maskinen tørker."], "hf": "Slik rengjør du filteret", "hf_note": "(hvis oppvasken ikke blir ren eller det står vann i bunnen)", "fsteps": ["Slå av maskinen og ta ut nederste kurv.", "Midt i bunnen sitter et rundt filter. Vri det mot klokken og løft det opp sammen med det flate nettet under.", "Skyll alt under springen og kast matrester i søpla, ikke i vasken.", "Sett det tilbake og vri med klokken til det stopper. Bruk aldri maskinen uten filter eller med et løst filter."], "h5": "Hvis noe går galt", "err_head": ["Hva du ser", "Hva du gjør"], "err": [["Knappene reagerer ikke", "Knappelåsen er på. Finn knappen med nøkkelsymbol eller teksten «3 seg» og hold den inne i 3‑4 sekunder til symbolet slukker."], ["Displayet viser en kode med bokstaven E (for eksempel E:15)", "Ta et bilde av koden. Slå av maskinen med strømknappen og send oss en melding."], ["Skum eller vann på gulvet", "Slå av maskinen, steng kranen og send oss en melding med en gang."], ["Det står vann i bunnen etter oppvasken", "Filteret er tett. Rengjør det som beskrevet ovenfor."]]}, "sv": {"h1": "Innan du fyller maskinen", "l1": ["Skrapa matrester i soporna: ben, kärnor, ris och servetter sätter igen filtret. Du behöver inte skölja under kranen.", "Ställ tallrikarna i nedre korgen med framsidan mot mitten, och koppar och glas upp och ner i övre korgen.", "Gafflar och skedar i bestickkorgen, knivar med spetsen nedåt.", "Kontrollera att inget hindrar spolarmarna (bladen upptill och nedtill) från att snurra, och snurra dem för hand.", "Lägg inte i maskinen: skärbrädor och skedar av trä, gjutjärn"], "h2": "Tabletten", "intro2": "På insidan av luckan finns en doserare med lock. Lägg i en diskmaskinstablett och stäng locket tills det klickar.", "rule_label": "Huvudregeln:", "rule": "bara diskmaskinstabletter eller diskmaskinspulver.", "l2": ["Vanligt handdiskmedel ger ett berg av skum redan med några droppar, och det rinner ut på golvet.", "Tvättkapslar för tvättmaskinen ska inte heller hit, och tvärtom.", "Du behöver inte fylla på salt eller sköljmedel, det gör vi. Om symbolen för salt eller sköljmedel tänds på panelen, skriv bara till oss."], "h3": "Program och start", "steps": ["Slå på maskinen med strömknappen.", "Välj program med programknappen.", "Tryck på Start och stäng luckan."], "prog_intro": "Programnamnen är på spanska:", "prog_head": ["Vad du diskar", "Program"], "prog": ["Vanlig disk efter maten", "Du vet inte vad du ska välja", "Kastruller, stekpannor och fastbränt", "Lätt smutsig disk, när det är bråttom", "Bara sköljning, så att disken kan vänta tills maskinen är full"], "prog_note": "Eco tar ungefär 3,5 timmar. Det är normalt: det är det mest sparsamma programmet.", "h4": "Efter disken", "l4": ["Öppna inte luckan mitt i ett program: det är het ånga därinne. Om du måste, öppna en liten springa och vänta ett par sekunder.", "När programmet är klart, låt disken svalna i 10‑15 minuter så torkar den klart av sig själv.", "Töm den nedre korgen först och sedan den övre, annars droppar vatten från kopparna ner på rena tallrikar.", "Lämna luckan på glänt så att maskinen torkar."], "hf": "Så rengör du filtret", "hf_note": "(om disken inte blir ren eller det står vatten i botten)", "fsteps": ["Stäng av maskinen och ta ut den nedre korgen.", "I mitten av botten sitter ett runt filter. Vrid det moturs och lyft upp det tills
